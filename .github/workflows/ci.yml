name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores ~/.npm keyed on package-lock.json; npm ci still installs
          # from the lockfile, it just stops downloading every tarball again.
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      # --fix is in the package script for local use; CI must not rewrite files
      # and call it green, so run eslint directly.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      # tsconfig.json covers src and test, so a spec or e2e suite that stops
      # compiling fails here instead of at runtime inside ts-jest.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test -- --ci --runInBand

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verification_db
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails on a
        # cold runner roughly one run in five.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Not `development`: synchronize stays off, so the suite runs against the
      # schema the migrations build, which is the one production gets.
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: verification_db
      JWT_SECRET: ci-secret-not-used-outside-ci
      CSRF_SECRET: ci-csrf-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      # The TypeORM CLI data source loads compiled entities and migrations
      # from dist/, so the build has to come first.
      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      # testnet-fork.e2e-spec.ts skips itself unless FORK_RPC_URL is set.
      - name: E2E
        run: npm run test:e2e -- --ci --runInBand

  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      # foundry.toml interpolates these into [rpc_endpoints] and [etherscan].
      # Nothing here talks to a network; the placeholders only keep the config
      # resolvable so build and test never depend on testnet secrets.
      PROM_TESTNET_RPC_URL: http://127.0.0.1:8545
      PROM_TESTNET_EXPLORER_API_URL: http://127.0.0.1/api
      PROM_TESTNET_EXPLORER_API_KEY: unused
    steps:
      # forge-std is a git submodule under contracts/lib.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      # Keyed on the sources themselves, not on a lockfile: forge rebuilds
      # everything when any .sol changes, so a coarser key would never hit.
      - name: Cache forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/**/*.sol', 'contracts/foundry.toml', 'contracts/foundry.lock') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # The testnet profile is what actually ships (optimizer on, no metadata
      # hash). Building it here catches optimizer-only failures that the
      # default profile never sees.
      - name: Build testnet profile
        run: forge build
        env:
          FOUNDRY_PROFILE: testnet
