name: release

# Cut a release by bumping the version and pushing the tag npm creates:
#
#   npm version <patch|minor|major> -m "chore: release v%s"
#   git push origin main --follow-tags
#
# The image workflow reacts to the same tag and publishes the semver image
# tags (X.Y.Z and X.Y) next to the sha tag.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # A tag that is not valid semver, or that disagrees with package.json,
      # would publish an image whose tag and reported version differ.
      - name: Validate version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semantic version (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$version" ]; then
            echo "::error::Tag '$tag' does not match package.json version '$pkg'. Bump with 'npm version' and tag that commit."
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
